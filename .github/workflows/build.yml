name: Build VidDL (IPA + Sileo repo)
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        working-directory: ios
        run: |
          brew install xcodegen ldid dpkg
          xcodegen generate
          xcodebuild -project VidDL.xcodeproj -scheme VidDL -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP=build/Build/Products/Release-iphoneos/VidDL.app
          ldid -S "$APP/VidDL"
          mkdir -p ../out/Payload && cp -R "$APP" ../out/Payload/
          (cd ../out && zip -qr VidDL.ipa Payload)
      - name: Package .deb (rootful + rootless)
        run: |
          for ARCH in iphoneos-arm iphoneos-arm64; do
            D=out/deb-$ARCH; mkdir -p $D/DEBIAN
            sed "s/ARCH/$ARCH/" packaging/control > $D/DEBIAN/control
            cp packaging/postinst $D/DEBIAN/
            if [ $ARCH = iphoneos-arm64 ]; then P=$D/var/jb/Applications; sed -i '' 's#file:///Applications#file:///var/jb/Applications#' $D/DEBIAN/control; else P=$D/Applications; fi
            mkdir -p $P && cp -R out/Payload/VidDL.app $P/
            dpkg-deb -Zgzip -b $D out/com.rixtasy.viddl_1.0.0_$ARCH.deb
          done
      - name: Build Sileo repo
        run: |
          mkdir -p site/debs && cp out/*.deb site/debs/ && cp out/VidDL.ipa site/
          cd site
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -kf Packages; gzip -kf Packages
          cat > Release <<R
          Origin: VidDL Repo
          Label: VidDL
          Suite: stable
          Version: 1.0
          Codename: viddl
          Architectures: iphoneos-arm iphoneos-arm64
          Components: main
          Description: Official VidDL source
          R
          echo '<h1>VidDL Sileo source</h1><p>Add this page URL in Sileo → Sources. <a href="VidDL.ipa">Download IPA</a></p>' > index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "v1.0.0-${{ github.run_number }}", files: "out/VidDL.ipa\nout/*.deb" }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
