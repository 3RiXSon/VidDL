name: VidDL
options: { bundleIdPrefix: com.rixtasy, deploymentTarget: { iOS: "15.0" } }
targets:
  VidDL:
    type: application
    platform: iOS
    sources: [VidDL]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rixtasy.viddl
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: VidDL/Info.plist
        SWIFT_VERSION: "5.0"
